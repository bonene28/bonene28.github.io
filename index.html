<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMT Miner | Alberto Marketplace Token</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto,Arial,sans-serif}
        :root{--prim:#6C5CE7;--sec:#00CEC9;--gold:#FDCB6E;--dark:#2D3436;--light:#F9F9F9;--grad:linear-gradient(135deg,var(--prim),var(--sec))}
        body{min-height:100vh;background:linear-gradient(180deg,#1A1A2E,#16213E);color:#fff;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem}
        .header{text-align:center;margin-bottom:2.5rem}
        .logo{width:90px;height:90px;border-radius:1.2rem;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:2.8rem;font-weight:900;margin:0 auto 1rem;box-shadow:0 0 25px rgba(108,92,231,.4)}
        h1{font-size:1.9rem;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .sub{color:#B2B2C1;margin-top:.3rem}

        .miner-card{background:rgba(255,255,255,.06);border-radius:1.6rem;padding:2rem;width:100%;max-width:420px;border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px);box-shadow:0 10px 40px rgba(0,0,0,.25)}
        .core-wrap{display:flex;align-items:center;justify-content:center;margin:1rem 0 2.4rem}
        .mining-core{width:160px;height:160px;border-radius:50%;background:conic-gradient(from 0deg,var(--prim),var(--sec),var(--gold),var(--prim));position:relative;animation:spin 3s linear infinite;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 14px rgba(108,92,231,.6))}
        .core-inner{width:130px;height:130px;border-radius:50%;background:#16213E;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:pulse 1.8s ease-in-out infinite alternate}
        .core-inner strong{font-size:1.4rem;color:var(--gold)}
        .core-inner span{font-size:.75rem;color:#aaa;margin-top:.1rem}

        .stat-row{display:flex;justify-content:space-between;padding:1rem 0;border-bottom:1px dashed rgba(255,255,255,.12)}
        .stat-row:last-child{border:none}
        .stat-label{color:#B2B2C1;font-size:.92rem}
        .stat-value{font-weight:700;font-size:1rem;color:#fff}
        .stat-value.highlight{color:var(--gold)}

        .btn{width:100%;border:none;border-radius:.9rem;padding:.9rem;font-size:1rem;font-weight:600;cursor:pointer;transition:.3s ease;margin-top:1.6rem}
        .btn-start{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(108,92,231,.4)}
        .btn-start.paused{opacity:.85;background:linear-gradient(135deg,#636E72,#4A5568)}
        .btn:hover{transform:translateY(-2px)}

        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes pulse{from{box-shadow:inset 0 0 18px rgba(108,92,231,.35)}to{box-shadow:inset 0 0 28px rgba(0,206,201,.55)}}
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">AMT</div>
        <h1>Alberto Marketplace Token</h1>
        <p class="sub">Ecosystem Mining Core • amt‑mining‑core‑v4</p>
    </header>

    <main class="miner-card">
        <div class="core-wrap">
            <div class="mining-core" id="miningCore">
                <div class="core-inner">
                    <strong id="amtCount">0.00</strong>
                    <span>AMT MINED</span>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-row">
                <span class="stat-label">Total Supply</span>
                <span class="stat-value">25 000 000 AMT</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Mining Rate</span>
                <span class="stat-value highlight" id="rate">+0.08 AMT / sec</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Status</span>
                <span class="stat-value" id="status">🟢 Mining…</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Session Uptime</span>
                <span class="stat-value" id="uptime">00:00:00</span>
            </div>
        </div>

        <button class="btn btn-start" id="toggleBtn">⏸️ Pause Mining</button>
    </main>

    <script>
        // === AMT — Alberto Marketplace Token Miner v4 ===
        let minedAmt=0, isRunning=true, startTime=Date.now(), rate=0.08;
        let core=document.getElementById('miningCore'), countEl=document.getElementById('amtCount'),
            statusEl=document.getElementById('status'), btn=document.getElementById('toggleBtn'),
            uptimeEl=document.getElementById('uptime');

        // Update every frame
        function loop(){
            if(isRunning){
                minedAmt+=rate/60; // 60fps = per frame
                countEl.textContent=minedAmt.toFixed(2);
            }
            // Uptime counter
            let secs=Math.floor((Date.now()-startTime)/1000);
            let h=String(Math.floor(secs/3600)).padStart(2,'0'),
                m=String(Math.floor((secs%3600)/60)).padStart(2,'0'),
                s=String(secs%60).padStart(2,'0');
            uptimeEl.textContent=`${h}:${m}:${s}`;
            requestAnimationFrame(loop);
        }

        // Toggle mine/pause
        btn.addEventListener('click',()=>{
            isRunning=!isRunning;
            if(isRunning){
                core.style.animation='spin 3s linear infinite';
                statusEl.textContent='🟢 Mining…';
                btn.textContent='⏸️ Pause Mining';
                btn.classList.remove('paused');
            }else{
                core.style.animationPlayState='paused';
                statusEl.textContent='🔴 Paused';
                btn.textContent='▶️ Start Mining';
                btn.classList.add('paused');
            }
        });

        // START!
        loop();
    </script>
</body>
</html>
